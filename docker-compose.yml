services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    env_file: .env
    ports:
      - "8002:8002"
    volumes:
      - C:/Users/LENOVO/.gmail-mcp:/home/appuser/.gmail-mcp

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    environment:
      BACKEND_URL: http://backend:8002
    ports:
      - "8501:8501"
    depends_on:
      - backend